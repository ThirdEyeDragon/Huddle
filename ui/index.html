async function emPrep(f){const T={'image/png':'png','image/jpeg':'jpg','image/gif':'gif','image/webp':'webp'},LIM=256*1024,ext=T[f.type];

  <section class="ppSec" ${i()}><h4>About me</h4><div class="ppAbt${p.bio?'':' none'}">${p.bio?emo(esc(p.bio)):'Nothing here yet.'}</div></section>
  ${inG?`<section class="ppSec" ${i()}><h4>Roles${pills.length?`<b>${pills.length}</b>`:''}</h4><div class="ppRoles">${pills.join('')||'<span class="ppNone">No roles assigned</span>'}</div></section>`:''}
  <div class="ppAct" ${i()}>${o!=oid?'<button class="on" data-a="dm">Message</button>':''}${canFr(o)?`<button data-a="fr"${st2=='friend'?' class="off"':''}>${FRL[st2]}</button>`:''}${hasMod?'<button data-a="mod">🛡️ Moderate ›</button>':''}<button data-a="x">Close</button></div></div>
  <div class="pcSub"><div class="smHd"><button class="smBack" data-a="back">‹ Back</button><span>Moderation</span></div>${subs.join('')}</div></div>`}}
function toDialog(o){const g=G[sel];if(!g)return;const nm=(P[o]||{}).name||'this member',pre=[['60 seconds',60],['5 minutes',300],['10 minutes',600],['1 hour',3600],['1 day',86400],['1 week',604800]];
  modal(`<h3>Timeout ${esc(nm)}</h3><p class="pb">They will not be able to send messages or files until the time is up.</p><div class="tos">${pre.map(([t,s])=>`<button data-s="${s}">${t}</button>`).join('')}</div><div class="fl">Custom time<div class="icrow"><input id="tn" type="number" min="1" max="999" value="30" style="width:90px"><select id="tu" style="width:auto"><option value="60">minutes</option><option value="3600">hours</option><option value="86400">days</option></select><button class="on" id="tgo">Timeout</button></div></div><button id="gx">Cancel</button>`,()=>{
    const go=s=>{if(!(s>=10&&s<=28*86400))return toast('Pick a time between 10 seconds and 28 days.');if(send({t:'gmod',g:g.id,o,a:'timeout',secs:s})){closeM();toast(nm+' was timed out.',true)}else toast('Not connected. Try again in a moment.')};
    $('#modal .tos').onclick=e=>{const b=e.target.closest('[data-s]');if(b)go(+b.dataset.s)};$('#tgo').onclick=()=>go(Math.round(+$('#tn').value*+$('#tu').value));$('#gx').onclick=closeM;$('#tn').onkeydown=e=>{if(e.key=='Enter')$('#tgo').click()}})}
function banDialog(g0){const gid=g0.id,draw=()=>{const b=(G[gid]||g0).bans||[];$('#bl').innerHTML=b.map(o=>`<div class="mrow"><div class="mwho">${avs(o,(P[o]||{}).name||'?')}<span class="nn">${esc((P[o]||{}).name||'Unknown user')}</span><button class="off" data-ub="${o}">Unban</button></div></div>`).join('')||'<div class="empty">No one is banned.</div>'};
  modal('<h3>Banned members</h3><div id="bl" style="display:grid;gap:8px;max-height:50vh;overflow:auto"></div><button id="gx">Close</button>',()=>{draw();sRefresh=id=>{if(id==gid&&$('#bl'))draw()};$('#bl').onclick=e=>{const b=e.target.closest('[data-ub]');if(b)send({t:'gmod',g:gid,o:b.dataset.ub,a:'unban'})};$('#gx').onclick=closeM})}
const tLeft=ms=>{const s=Math.ceil(ms/1000);return s>=86400?Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h':s>=3600?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':s>=60?Math.floor(s/60)+'m '+s%60+'s':s+'s'};
const myTmo=()=>{const g=G[sel],t=g&&(g.timeouts||{})[oid];return t&&t>Date.now()?t:0},
  canSend=ch=>chCan(ch,'view')&&chCan(ch,'send'),
  canFile=ch=>chCan(ch,'send')&&chCan(ch,'files'),
  canVc=ch=>chCan(ch,'view')&&chCan(ch,'connect');
function tmoPaint(){const t=myTmo(),x=$('#txt'),f=canFile(cur),sd=canSend(cur);if(!x)return;
  x.disabled=!!t||!sd;x.placeholder=t?'⏱ You are timed out for '+tLeft(t-Date.now()):sd?'Send a message':chCan(cur,'view')?'You do not have permission to send messages in this channel':'You do not have permission to view this channel';$('#go').disabled=!!t||!sd;
  const a=$('#attach');a.disabled=!!t||!f;a.title=t?'You are timed out':f?'Share a file':'You do not have permission to send files in this channel'}
function tmoNote(ng){const was=((G[ng.id]||{}).timeouts||{})[oid],now=(ng.timeouts||{})[oid];if(now&&now>Date.now()&&now!=was)toast('You were timed out. You can chat again in '+tLeft(now-Date.now())+'.')}
setInterval(tmoPaint,1000);
function cardPlace(){const c=popEl,r=popR,W=innerWidth,H=innerHeight,M=8,w=c.offsetWidth,h=c.offsetHeight,cl=(v,a,b)=>Math.max(a,Math.min(v,b));let x,y;
  if(!r){x=(W-w)/2;y=(H-h)/2}
  else{const gap=12,cx=r.left+r.width/2,roomL=r.left-gap-M,roomR=W-r.right-gap-M;let left=cx>W/2?roomL>=w||roomL>=roomR:!(roomR>=w||roomR>=roomL);
    x=left?r.left-gap-w:r.right+gap;if(W-2*M<w+r.width+gap){x=(W-w)/2;y=r.bottom+gap;if(y+h>H-M)y=r.top-gap-h}else y=r.top+r.height/2-64;
    x=cl(x,M,W-w-M);y=cl(y,M,H-h-M)}
  c.style.left=x+'px';c.style.top=y+'px';c.style.transformOrigin=r?(r.left+r.width/2-x)+'px '+(r.top+r.height/2-y)+'px':'50% 50%'}
function showCard(o,anchor){const same=popEl&&popO==o;closeCard(true);if(same)return;
  popO=o;popSub=false;popR=pointRect(anchor);const c=popEl=document.createElement('div');c.className='pcard gfx';c.setAttribute('role','dialog');c.setAttribute('aria-label','Profile');c.tabIndex=-1;
  const v=cardHTML(o),inn=document.createElement('div');inn.className='pcIn';c.append(inn);c.style.setProperty('--pc',v.col);inn.innerHTML=v.html;gApply(c,v.p);popEl.dataset.h=v.html+gKey(v.p);c.style.visibility='hidden';document.body.append(c);cardPlace();c.style.visibility='';
  c.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const a=b.dataset.a;
    if(!a||a=='x')return closeCard();if(a=='mod'||a=='back'){popSub=a=='mod';c.querySelector('.pcPages').dataset.sub=popSub?1:0;return}if(a=='nick'){closeCard();nickDialog(o)}else if(a=='dm'){closeCard();openDm(o)}else if(a=='fr')frAct(FRA[frSt(o)],o)
    else if(a=='timeout'){closeCard();toDialog(o)}
    else if(['mute','unmute','deafen','undeafen','untimeout','vkick'].includes(a))send({t:'gmod',g:sel,o,a})
    else if(a=='ban'&&confirm('Ban '+((P[o]||{}).name||'this person')+' from this server? They cannot rejoin with the invite code until unbanned.')){send({t:'gmod',g:sel,o,a:'ban'});closeCard()}
    else if(a=='kick'&&confirm('Remove '+((P[o]||{}).name||'this person')+' from this server?')){send({t:'gkick',g:sel,o});closeCard()}}}
function cardRefresh(){if(!popEl)return;const g=G[sel];if(!g||!P[popO])return closeCard(true);const v=cardHTML(popO);const k=v.html+gKey(v.p);if(popEl.dataset.h==k)return;popEl.dataset.h=k;
  popEl.classList.add('rf');popEl.style.setProperty('--pc',v.col);popEl.firstChild.innerHTML=v.html;gApply(popEl,v.p);cardPlace()}
function closeCard(now){const c=popEl;if(!c)return;popEl=null;popO='';popR=null;
  if(now===true||matchMedia('(prefers-reduced-motion:reduce)').matches)return c.remove();c.classList.add('out');c.addEventListener('animationend',()=>c.remove(),{once:true});setTimeout(()=>c.remove(),250)}

$('#plist').onclick=e=>{const b=e.target.closest('.pa');if(b)openProfile(b.dataset.o,false,b)};$('#meBtn').onclick=()=>openProfile(oid,true);
(async()=>{const s=await window.api.get();showForm(!s.invite);const t=tokGet();if(t&&s.invite){CRED={mode:'token',token:t};connect('')}})(); // signs in automatically only if “Remember me” was ticked
