.sd{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:#7a7a85;pointer-events:none}
[data-s=online]>.sd{background:#3ddc84}[data-s=dnd]>.sd{background:#ff4d4d}[data-s=sleep]>.sd{background:#ffc83d}[data-s=offline]>.sd{background:#7a7a85}
aside .sd{border-color:var(--panel)}#meBtn .sd{border-color:var(--raise);width:13px;height:13px}.pc .sd{border-color:var(--panel);width:22px;height:22px;border-width:4px;right:0;bottom:0}
.meRow{display:flex;gap:6px;margin-top:8px}.meRow #meBtn{margin-top:0;flex:1;min-width:0}
#stBtn{flex:none;width:46px;padding:0;display:grid;place-items:center;border-radius:14px}.sd2{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--stc,#3ddc84)}
#cm .sd2{margin-right:9px;vertical-align:-1px}
@media(max-width:700px){.meRow{margin:0}#stBtn{width:34px;height:34px}}
#plist{flex:1;min-height:0;overflow:auto}#online,#offline{display:flex;flex-direction:column;gap:2px;overflow:visible;padding:0;flex:none}#offline .pa{opacity:.6}
@media(max-width:700px){#plist{display:none}}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
#vrow{position:relative}
.vr.joining::before{content:"";position:absolute;inset:-3px;border-radius:15px;padding:2px;pointer-events:none;
 background:conic-gradient(from var(--a),#3fe0c500 0%,#3fe0c5 60%,#e6fffa 95%,#3fe0c500 100%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
 animation:vspin 1s linear infinite}
@keyframes vspin{to{--a:360deg}}
.vr.pop{animation:vpulse .9s ease-out 2}
@keyframes vpulse{from{box-shadow:0 0 0 0 #3fe0c5b0}to{box-shadow:0 0 0 16px #3fe0c500}}
@media(prefers-reduced-motion:reduce){.vr.joining::before{animation:none;background:var(--live)}.vr.pop{animation:none}}
#app{grid-template-columns:68px 244px minmax(0,1fr)}
#rail{background:#030304;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow:auto;min-height:0}
#rail hr{width:32px;border:0;border-top:1px solid var(--line);margin:0}
.ri{position:relative;width:46px;height:46px;padding:0;border-radius:50%;font:700 18px var(--serif);flex:none;background:hsl(var(--h,330) 45% 30%);transition:border-radius .15s}
.ri:hover,.ri.sel{border-radius:16px}.ri.sel{border-color:var(--tx)}.ri.add{background:var(--raise);color:var(--live);font-size:22px}.ri .badge{position:absolute;right:-4px;bottom:-4px}
#gh{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 10px;order:-1}#gh button{padding:0 10px}
.vr{position:relative;display:block;width:100%;text-align:left;border-radius:12px;border-color:transparent;background:transparent;color:var(--dim)}.vr:hover{color:var(--tx)}.vr.in{color:var(--live);border-color:var(--live);background:#0a1f1b}
.vmem{margin:0 0 4px 22px}.vmem .vm{padding:2px 4px;color:var(--dim)}
#callBtn{margin:0 8px 0 auto}#cc{font-size:12px;color:var(--dim);flex:none}#cc.max{color:var(--bad)}.ri img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.cg{opacity:0;font-style:normal;margin-left:6px;color:var(--dim)}.tab:hover .cg,.vr:hover .cg{opacity:1}.vr .cg{float:right}.cg:hover{color:var(--tx)}#pname[readonly]{cursor:default}#callBtn[hidden]{display:none}
.rxs{display:flex;gap:4px;flex-wrap:wrap}.rx{padding:0 8px;font-size:13px;margin-top:4px}.rx.me{border-color:var(--ac);background:#260c18}
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}#rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px}#rail hr{width:0;height:32px;border-top:0;border-left:1px solid var(--line)}}
#chtitle .ctm,.ctm{display:block;color:var(--live);font:12px system-ui,sans-serif;font-variant-numeric:tabular-nums}.vr+.ctm{margin:-2px 0 2px 22px}
.hasg,.pa.hasg:hover,#meBtn.hasg{background-image:linear-gradient(90deg,color-mix(in srgb,var(--gl) 42%,transparent),color-mix(in srgb,var(--gr) 42%,transparent))}.tab.sel.hasg{background-image:none}
.pfx{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:13px}.pfx label{display:flex;align-items:center;gap:6px}.pfx input[type=color]{width:38px;height:28px;padding:1px;border-radius:8px}.pfx select{padding:4px 8px}
.avw>.av{position:relative;z-index:1}.avw .sd{z-index:2}
.avw[data-fx]:not([data-fx=""]):not([data-fx=sparkle])::before{content:"";position:absolute;inset:-3px;border-radius:50%;pointer-events:none;z-index:0}
.avw[data-fx=neon]::before{background:var(--rc);box-shadow:0 0 6px var(--rc),0 0 18px var(--rc)}.avw[data-fx=breathe]::before{background:var(--rc);animation:avBr 3.2s ease-in-out infinite}
.avw[data-fx=flicker]::before{background:var(--rc);box-shadow:0 0 10px var(--rc);animation:gFlick 4.2s linear infinite}.avw[data-fx=heartbeat]::before{background:var(--rc);animation:gBeat 1.9s ease-in-out infinite}
.avw[data-fx=dash]::before{inset:-4px;background:repeating-conic-gradient(var(--rc) 0 14deg,transparent 14deg 28deg);animation:spin 8s linear infinite}
.avw[data-fx=comet]::before{inset:-4px;background:conic-gradient(from var(--ga),transparent 0 45%,var(--rc));animation:gSpin 1.7s linear infinite}
.avw[data-fx=sparkle]::after{content:"";position:absolute;inset:-8px;border-radius:50%;pointer-events:none;z-index:3;background:radial-gradient(circle at 50% 2%,var(--rc) 0 1.6px,transparent 2.8px),radial-gradient(circle at 98% 44%,var(--rc) 0 1.4px,transparent 2.6px),radial-gradient(circle at 22% 92%,var(--rc) 0 1.6px,transparent 2.8px),radial-gradient(circle at 4% 30%,var(--rc) 0 1.2px,transparent 2.4px),radial-gradient(circle at 80% 90%,var(--rc) 0 1.4px,transparent 2.6px),radial-gradient(circle at 86% 12%,var(--rc) 0 1.2px,transparent 2.4px);animation:avTw 2.2s ease-in-out infinite,spin 14s linear infinite}
@keyframes avBr{0%,100%{opacity:.2}50%{opacity:1}}@keyframes avTw{0%,100%{opacity:.3}50%{opacity:1}}
.avw[data-fx=ring]::before{background:var(--rc)}.avw[data-fx=glow]::before{background:var(--rc);inset:-4px;filter:blur(5px)}
.avw[data-fx=pulse]::before{background:var(--rc);animation:pu 1.6s ease-in-out infinite}
.avw[data-fx=orbit]::before{background:conic-gradient(var(--gl),var(--gr),var(--gl));animation:spin 2.5s linear infinite}
.avw[data-fx=rainbow]::before{background:conic-gradient(#ff5c5c,#ffd75c,#5cff8a,#5cc8ff,#c45cff,#ff5c5c);animation:spin 2.5s linear infinite}
@keyframes pu{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
@media(prefers-reduced-motion:reduce){.avw::before,.avw::after,[data-nfx],.ppBan::before,.ban::before{animation:none!important}}
@media(min-width:701px){#app{grid-template-columns:68px 244px minmax(0,1fr) 220px}#app:has(#plist[hidden]){grid-template-columns:68px 244px minmax(0,1fr)}
#plist{background:var(--panel);border-left:1px solid var(--line);padding:10px 8px;min-height:0;overflow:auto}#plist[hidden]{display:none}#plist .sh:first-child{margin-top:8px}}
.wlc{padding:36px 4px 22px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.wlc h2{margin:0 0 8px;font:700 clamp(30px,5vw,46px)/1.1 var(--serif);letter-spacing:-.01em;overflow-wrap:anywhere}
.wlc p{margin:0;color:var(--dim);font-size:16px}
@media(min-width:701px){

.meRow #meBtn{margin:0;padding:6px 10px 6px 8px;border-radius:14px;gap:10px;transition:background .15s,border-color .15s}
.meRow #meBtn:hover{background-color:var(--hi);border-color:var(--dim)}
.meRow #meBtn .av{--s:36px}
.meRow #meBtn .who{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.2;text-align:left}
.meRow #meBtn .who small{font-size:12px;color:var(--dim)}
.meRow #meBtn::after{content:"✎";margin-left:auto;font-size:15px;color:var(--dim);opacity:.7}.meRow #meBtn:hover::after{color:var(--tx);opacity:1}
.meRow #stBtn{width:44px;height:auto;border-radius:14px}
}

.ci{display:inline-block;width:24px;height:24px;margin-right:10px;vertical-align:middle;flex:none;object-fit:contain}
.ci.d{background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.ci.d.t{--m:var(--ic-t)}.ci.d.v{--m:var(--ic-v)}
.cn{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chtitle .ci{display:inline-block;width:24px;height:24px;margin-right:10px;vertical-align:-4px}
.tab,.vr{min-height:42px}.tab{padding-top:5px;padding-bottom:5px}.vr{display:flex;align-items:center}.vr .cg{margin-left:auto;float:none}
.icrow{display:flex;align-items:center;gap:8px}.icrow .prev{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--raise);border:1px solid var(--line);font-size:22px;flex:none}.icrow .prev .ci{margin:0}
.icrow button{padding:5px 12px;font-size:14px}.icrow small{color:var(--dim);flex:1;min-width:0}
/* selected channel: grey -> light grey */
.tab.sel,.tab.sel.hasg{background:linear-gradient(90deg,#4a4a52 0%,#8f8f99 55%,#c4c4cc 100%);color:#fff;border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tab.sel .cg,.tab.sel .cg:hover{color:#fff}
/* rounder images */
img.ci{border-radius:7px}
.vmem .vm .av.s28{--s:38px;border-radius:12px}
.vmem .vm{gap:10px;font-size:15px;padding:3px 4px}.vmem{margin:2px 0 6px 20px}
/* topic under the channel name */
#chtitle{display:flex;flex-direction:column;justify-content:center;min-width:0}
#chtitle .tn{display:flex;align-items:center}
#chtitle .td{display:block;font:13px system-ui,sans-serif;color:var(--dim);margin:2px 0 0 34px;max-width:60ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* categories */
#cats{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.cat{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.cat-h{display:flex;align-items:center;gap:4px;padding:0 4px 0 2px}
.cat-t{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 6px;border-radius:8px;color:var(--dim);font:700 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:left}
.cat-t:hover{color:var(--tx)}.cat-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-t i{font-style:normal;display:inline-block;width:12px;transition:transform .15s}.cat.col .cat-t i{transform:rotate(-90deg)}
.cat-act{display:flex;gap:2px;opacity:0;transition:opacity .12s}.cat-h:hover .cat-act,.cat-act:focus-within{opacity:1}
.cat-act button{background:none;border:0;padding:2px 7px;border-radius:8px;color:var(--dim);font-size:14px;min-height:0}.cat-act button:hover{color:var(--tx);background:var(--raise)}
.cat-b{display:flex;flex-direction:column;gap:2px}
.cat-e{color:var(--dim);font-size:13px;padding:4px 14px;opacity:.7}
.cat.col .cat-b .tab:not(.sel),.cat.col .cat-b .vi:not(.vin),.cat.col .cat-e{display:none}
@media(max-width:700px){#cats{flex-direction:row;margin:0}.cat,.cat-b{display:contents}.cat-h,.cat-e{display:none}.vi{display:contents}}

/* ===== polish: layout untouched, everything feels smoother ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
